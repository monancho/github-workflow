name: Portable CLI smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supported:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack
      - run: npm install --prefix ./portable-install ./github-workflow-0.1.0.tgz
      - run: npm install --global ./github-workflow-0.1.0.tgz
      - run: github-workflow --help
      - run: github-workflow --version
      - run: node test/platform-smoke.mjs

  unsupported-runtime:
    name: Node 20 rejected by engine contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Require incompatible install to fail
        shell: bash
        run: |
          if npm ci --engine-strict; then
            echo "Node 20 unexpectedly satisfied package engines" >&2
            exit 1
          fi
